# Development overrides — hot reload and bind mounts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      context: ./api_services
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    command: npm run start:dev
    volumes:
      - ./api_services:/app
      - api_node_modules:/app/node_modules

  web:
    build:
      context: ./web_services
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./web_services:/app
      - web_node_modules:/app/node_modules

  mobile:
    build:
      context: ./mobile_services
      dockerfile: Dockerfile.dev
    volumes:
      - ./mobile_services:/app
      - mobile_node_modules:/app/node_modules

  agentic-ai:
    build:
      context: ./agentic_ai_services
      dockerfile: Dockerfile.dev
    volumes:
      - ./agentic_ai_services:/app

volumes:
  api_node_modules:
  web_node_modules:
  mobile_node_modules:
